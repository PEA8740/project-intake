// ═══════════════════════════════════════════════════════════════════════════════
// MAP SETUP
// ═══════════════════════════════════════════════════════════════════════════════
const map = L.map('map').setView([43.6535,-79.3839],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors',maxZoom:19
}).addTo(map);

const mkIcon = L.icon({
  iconUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  iconRetinaUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34]
});

let marker = L.marker([43.6535,-79.3839],{icon:mkIcon,draggable:true})
  .addTo(map).bindPopup('Toronto, Ontario, Canada').openPopup();

marker.on('dragend',()=>{
  const ll=marker.getLatLng();
  document.getElementById('coordPill').textContent=`📍 ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
  reverseGeocode(ll.lat,ll.lng);
  // Auto-confirm on manual marker move
  locationConfirmed=true;
  locationData={name:document.getElementById('locInput').value||'Custom location',lat:ll.lat,lng:ll.lng};
  updateLocStatus();
});
map.on('click',(e)=>{
  marker.setLatLng(e.latlng);
  document.getElementById('coordPill').textContent=`📍 ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  reverseGeocode(e.latlng.lat,e.latlng.lng);
  locationConfirmed=true;
  locationData={name:document.getElementById('locInput').value||'Custom location',lat:e.latlng.lat,lng:e.latlng.lng};
  updateLocStatus();
});

async function geocode(){
  const q=document.getElementById('locInput').value.trim();
  if(!q)return;
  const sp=document.getElementById('spinner');sp.style.display='block';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    if(d&&d.length>0){
      const lat=parseFloat(d[0].lat),lng=parseFloat(d[0].lon);
      const shortName=d[0].display_name.split(',').slice(0,3).join(',');
      map.setView([lat,lng],12);
      marker.setLatLng([lat,lng]).bindPopup(d[0].display_name).openPopup();
      document.getElementById('coordPill').textContent=`📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
      confirmAfterGeocode(shortName, lat, lng);
    }else alert('Location not found. Try a different search term.');
  }catch(e){alert('Search error. Check your internet connection.');}
  finally{sp.style.display='none';}
}
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    if(d&&d.address){
      const a=d.address;
      const name=[a.city||a.town||a.village,a.state,a.country].filter(Boolean).join(', ');
      document.getElementById('locInput').value=name||d.display_name;
    }
  }catch(e){}
}

// BUG-11: LOCATION STATE
// ═══════════════════════════════════════════════════════════════════════════════
const DEFAULT_LOC = {name:'Toronto, Ontario, Canada', lat:43.6535, lng:-79.3839};
let locationConfirmed = false;
let locationData = {...DEFAULT_LOC};
const DEFAULT_PLACEHOLDER = DEFAULT_LOC.name;

function confirmLocation(){
  const name = document.getElementById('locInput').value.trim();
  if(!name || name === DEFAULT_PLACEHOLDER){
    alert('Please enter a specific project location before confirming.');
    return;
  }
  const ll = marker.getLatLng();
  locationConfirmed = true;
  locationData = { name, lat: ll.lat, lng: ll.lng };
  updateLocStatus();
  // Hide submit block message if visible
  const msg = document.getElementById('submitBlockMsg');
  if(msg) msg.style.display='none';
}

function updateLocStatus(){
  const btn = document.getElementById('btnConfirmLoc');
  const badge = document.getElementById('locStatus');
  if(locationConfirmed){
    btn.textContent = '✓ Location confirmed';
    btn.classList.add('confirmed');
    btn.onclick = null;
    badge.textContent = '✅ ' + locationData.name;
    badge.className = 'loc-status confirmed';
  } else {
    btn.textContent = '✓ Confirm location';
    btn.classList.remove('confirmed');
    btn.onclick = confirmLocation;
    badge.textContent = '⚠ Location not confirmed';
    badge.className = 'loc-status unconfirmed';
  }
}

// Auto-confirm when geocoding succeeds or marker moved
function confirmAfterGeocode(name, lat, lng){
  document.getElementById('locInput').value = name;
  locationConfirmed = true;
  locationData = { name, lat, lng };
  updateLocStatus();
}

// BUG-12-C: SUBSCOPE FAMILY MAP
// ═══════════════════════════════════════════════════════════════════════════════
const SUBSCOPE_FAMILY_MAP = {
  drinking_water_subscopes:        'drinking_water',
  municipal_wastewater_subscopes:  'municipal_wastewater',
  industrial_wastewater_subscopes: 'industrial_wastewater',
  stormwater_subscopes:            'stormwater',
  groundwater_subscopes:           'groundwater',
  water_reuse_subscopes:           'water_reuse',
  residuals_subscopes:             'residuals_biosolids'
};

// ═══════════════════════════════════════════════════════════════════════════════
// BUG-12-B: CONTEXTUAL LABEL OVERRIDES
// ═══════════════════════════════════════════════════════════════════════════════
function getLabelOverrides(qId){
  if(qId!=='water_streams')return {};
  const mwwSub=answers['municipal_wastewater_subscopes']||[];
  const isDecentralized=mwwSub.includes('decentralized_onsite')
                      &&!mwwSub.includes('centralized_wwtp_operator');
  if(isDecentralized){
    return {raw_wastewater:'Raw wastewater (septic tank influent / household sewage)'};
  }
  return {};
}

// ═══════════════════════════════════════════════════════════════════════════════
// CONDITION ENGINE
// ═══════════════════════════════════════════════════════════════════════════════
function isVisible(q){
  const c=q.required_if;if(!c)return true;
  if(c.any_selected){
    const s=answers[c.any_selected.question]||[];
    return c.any_selected.values.some(v=>(Array.isArray(s)?s:[s]).includes(v));
  }
  if(c.equals)return answers[c.equals.question]===c.equals.value;
  if(c.all_selected){const s=answers[c.all_selected.question]||[];return c.all_selected.values.every(v=>s.includes(v));}
  if(c.none_selected){const s=answers[c.none_selected.question]||[];return!c.none_selected.values.some(v=>s.includes(v));}
  return true;
}
function visibleQ(){
  const visible=SCHEMA.questions.filter(isVisible);
  const families=answers['water_families']||[];
  if(!families.length)return visible;
  // BUG-12-C: stable sort — reorders only subscope questions by selection order
  return [...visible].sort((a,b)=>{
    const fa=SUBSCOPE_FAMILY_MAP[a.id];
    const fb=SUBSCOPE_FAMILY_MAP[b.id];
    if(fa&&fb)return families.indexOf(fa)-families.indexOf(fb);
    return 0;
  });
}

// ═══════════════════════════════════════════════════════════════════════════════
// BUG-01 + BUG-02: DYNAMIC OPTION FILTERING
// ═══════════════════════════════════════════════════════════════════════════════
function getFilteredOptions(q){
  if(q.id!=='water_streams'&&q.id!=='project_activities')return q.options;

  const families =answers['water_families']   ||[];
  const discharge=answers['discharge_type']   ||[];
  const source   =answers['water_source_type']||[];
  const mwwSub   =answers['municipal_wastewater_subscopes']||[];
  const dwSub    =answers['drinking_water_subscopes']      ||[];

  const hasDW   =families.includes('drinking_water');
  const hasMWW  =families.includes('municipal_wastewater');
  const hasIWW  =families.includes('industrial_wastewater');
  const hasReuse=families.includes('water_reuse');
  const hasSW   =families.includes('stormwater');
  const hasResid=families.includes('residuals_biosolids');
  const hasGW   =families.includes('groundwater');

  const hasDirect  =discharge.some(d=>['direct_surface_water','direct_groundwater'].includes(d));
  const hasIndirect=discharge.some(d=>['indirect_sanitary_sewer','indirect_storm_sewer'].includes(d));
  const hasLand    =discharge.includes('land_application');
  const hasReuseDis=discharge.includes('reuse_on_site');

  const RAW=[`river_stream`,`lake_reservoir`,`large_lake_system`,`ocean_coastal`,`confined_aquifer`,`unconfined_aquifer`,`rainwater_harvesting`];
  const hasRawSrc=source.some(s=>RAW.includes(s));
  const onMunOnly=source.includes('municipal_supply')&&!hasRawSrc;

  const isNetOp=mwwSub.includes('centralized_wwtp_operator')||dwSub.includes('drinking_water_distribution');

  if(q.id==='water_streams'){
    const filtered=q.options.filter(o=>{
      switch(o.id){
        case'raw_water':              return hasDW||(hasIWW&&!onMunOnly);
        case'raw_wastewater':         return hasMWW||hasIWW;
        case'industrial_process_water':return hasIWW;
        case'filter_backwash_water':  return hasDW||hasMWW;
        case'membrane_concentrate_ro_reject':return hasDW||hasReuse||hasIWW;
        case'recycled_process_water': return hasDW||hasMWW||hasIWW;
        case'disinfection_byproduct_streams':return hasDW||hasMWW;
        case'cooling_water':          return hasIWW;
        case'treated_drinking_water': return hasDW;
        case'treated_wastewater_effluent':return (hasMWW||hasIWW)&&(hasDirect||hasReuse||hasLand||hasReuseDis);
        case'sludge_biosolids':       return hasMWW||hasDW||hasIWW||hasResid;
        case'spent_filter_media_resin':return hasDW||hasMWW||hasIWW;
        case'stormwater_site_runoff': return hasSW||hasIWW||hasMWW;
        case'leachate':               return hasResid||hasIWW||(hasMWW&&hasGW);
        default:return true;
      }
    });
    // BUG-12-B: apply contextual label overrides
    const overrides=getLabelOverrides(q.id);
    return Object.keys(overrides).length===0
      ? filtered
      : filtered.map(o=>overrides[o.id]?{...o,label:overrides[o.id]}:o);
  }

  if(q.id==='project_activities'){
    return q.options.filter(o=>{
      switch(o.id){
        case'water_abstraction_withdrawal':return !onMunOnly;
        case'collection_conveyance':       return isNetOp;
        // BUG-03
        case'direct_environmental_discharge':return hasDirect||hasLand;
        case'sewer_connection_discharge':    return hasIndirect;
        case'reuse':                       return hasReuse||hasReuseDis;
        case'residuals_management':        return hasMWW||hasDW||hasIWW||hasResid;
        case'advanced_treatment':          return hasDW||hasMWW||hasReuse||hasIWW;
        default:return true;
      }
    });
  }
  return q.options;
}

// ═══════════════════════════════════════════════════════════════════════════════
// BUG-05: Q15 DYNAMIC LABEL
// ═══════════════════════════════════════════════════════════════════════════════
function getQ15Label(q){
  const discharge=answers['discharge_type']||[];
  const hasDirect=discharge.some(d=>['direct_surface_water','direct_groundwater'].includes(d));
  const hasIndirect=discharge.some(d=>['indirect_sanitary_sewer','indirect_storm_sewer'].includes(d));
  if(hasDirect&&!hasIndirect&&q.label_direct)return q.label_direct;
  if(hasIndirect&&!hasDirect&&q.label_indirect)return q.label_indirect;
  return q.label;
}

// ═══════════════════════════════════════════════════════════════════════════════
// BUG-08: MUTUAL EXCLUSION FOR Q19
// ═══════════════════════════════════════════════════════════════════════════════
const GW_EXCLUSIVE='no_groundwater_impact';
function applyGWExclusion(qId,optId,current){
  if(qId!=='groundwater_impact')return null;
  if(optId===GW_EXCLUSIVE)
    return current.includes(optId)?[]:[GW_EXCLUSIVE];
  const without=current.filter(v=>v!==GW_EXCLUSIVE);
  return without.includes(optId)?without.filter(v=>v!==optId):[...without,optId];
}

// ═══════════════════════════════════════════════════════════════════════════════
// VALIDATION
// ═══════════════════════════════════════════════════════════════════════════════
function validate(q){
  if(q.required===false||q.type==='text_area')return null;
  const v=answers[q.id];
  if(q.type==='multi_select'){if(!v||v.length===0)return'Please select at least one option to continue.';}
  else if(q.type==='radio'){if(!v)return'Please select one option to continue.';}
  return null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// DISPLAY HELPERS
// ═══════════════════════════════════════════════════════════════════════════════
function getDisplay(q){
  const v=answers[q.id];
  if(!v||(Array.isArray(v)&&v.length===0))return null;
  if(q.type==='text_area')return v.length>90?v.substring(0,90)+'…':v;
  if(Array.isArray(v))return v.map(id=>q.options?.find(o=>o.id===id)?.label||id).join(', ');
  return q.options?.find(o=>o.id===v)?.label||v;
}

// ═══════════════════════════════════════════════════════════════════════════════
// STATE & RENDER
// ═══════════════════════════════════════════════════════════════════════════════
let answers={},currentIdx=0;

function handleChange(qId,optId,isMulti,e){
  e.preventDefault();
  if(isMulti){
    // BUG-08: mutual exclusion
    const exclusive=applyGWExclusion(qId,optId,answers[qId]||[]);
    if(exclusive!==null){answers[qId]=exclusive;}
    else{
      let a=answers[qId]||[];
      answers[qId]=a.includes(optId)?a.filter(v=>v!==optId):[...a,optId];
    }
    // Reset downstream sub-scopes if water_families changed
    if(qId==='water_families'){
      ['drinking_water_subscopes','municipal_wastewater_subscopes','industrial_wastewater_subscopes',
       'stormwater_subscopes','groundwater_subscopes','water_reuse_subscopes','residuals_subscopes']
      .forEach(s=>delete answers[s]);
    }
  } else {
    answers[qId]=optId;
  }
  // Clear validation error
  const err=document.getElementById('errMsg');
  if(err){err.classList.remove('show');err.textContent='';}
  render();
}

function render(){
  const vis=visibleQ(),total=vis.length;
  if(currentIdx>=total){showDone();return;}
  const q=vis[currentIdx];
  // BUG-11: show soft invite if location not confirmed
  const inviteHtml = !locationConfirmed && currentIdx < 3
    ? `<div class="loc-invite" style="display:block">📍 Project location not yet confirmed — you can continue and confirm before submitting.</div>`
    : '';

  document.getElementById('progLbl').textContent=`Question ${currentIdx+1} of ${total}`;
  document.getElementById('stepBadge').textContent=q.step||'';
  document.getElementById('progFill').style.width=Math.round((currentIdx/total)*100)+'%';

  // BUG-05: dynamic Q15 label
  const label=q.id==='downstream_drinking_water_intake'?getQ15Label(q):q.label;
  const isReq=q.required!==false&&q.type!=='text_area';

  let html=inviteHtml+`<div class="q-label">${label}${isReq?'<span class="req"> *</span>':''}</div>`;
  if(q.help)html+=`<p class="q-help">${q.help}</p>`;

  if(q.id==='water_streams'||q.id==='project_activities'){
    const filtered=getFilteredOptions(q);
    const removed=q.options.length-filtered.length;
    if(removed>0)html+=`<p class="filter-note">${removed} option${removed>1?'s':''} hidden — not applicable to your project scope and discharge type.</p>`;
  }

  if(q.type==='text_area'){
    html+=`<textarea id="taInput" placeholder="${q.placeholder||''}" oninput="answers['${q.id}']=this.value">${answers[q.id]||''}</textarea>`;
  } else {
    const val=answers[q.id]||(q.type==='multi_select'?[]:null);
    const opts=getFilteredOptions(q);
    html+='<div class="options">';
    for(const opt of opts){
      const isMulti=q.type==='multi_select';
      const chk=isMulti?(val||[]).includes(opt.id):val===opt.id;
      const isExclusive=opt.id===GW_EXCLUSIVE?'exclusive-no':'';
      html+=`<label class="opt${chk?' active':''} ${isExclusive}" onclick="handleChange('${q.id}','${opt.id}',${isMulti},event)">
        <input type="${isMulti?'checkbox':'radio'}" name="${q.id}" value="${opt.id}"${chk?' checked':''}><span class="opt-label">${opt.label}</span>
      </label>`;
    }
    html+='</div>';
  }
  html+=`<div class="err-msg" id="errMsg"></div>`;

  document.getElementById('qBody').innerHTML=html;
  document.getElementById('btnPrev').disabled=currentIdx===0;
  document.getElementById('btnNext').textContent=currentIdx===total-1?'Submit ✓':'Next →';
  renderPrev();
}

function renderPrev(){
  const vis=visibleQ(),past=vis.slice(0,currentIdx).filter(q=>getDisplay(q));
  const el=document.getElementById('prevAnswers');
  if(!el)return;
  if(past.length===0){el.innerHTML='<p class="empty-prev">No previous answers yet.</p>';return;}
  el.innerHTML=past.map(q=>`<div class="prev-item"><div class="prev-q">${q.label}</div><div class="prev-a">${getDisplay(q)}</div></div>`).join('');
  el.scrollTop=el.scrollHeight;
}

function nav(dir){
  const vis=visibleQ();
  if(dir===1){
    const err=validate(vis[currentIdx]);
    if(err){
      const el=document.getElementById('errMsg');
      if(el){el.textContent='⚠ '+err;el.classList.add('show');}
      return;
    }
    // BUG-11: block submit if location not confirmed
    if(currentIdx>=vis.length-1){
      if(!locationConfirmed){
        let msg=document.getElementById('submitBlockMsg');
        if(!msg){
          msg=document.createElement('div');
          msg.id='submitBlockMsg';
          msg.className='submit-block-msg';
          document.querySelector('.nav').before(msg);
        }
        msg.innerHTML='📍 <strong>Location required before submitting.</strong> Please enter a project location above and click <em>Confirm location</em>.';
        msg.style.display='block';
        // Scroll to top to show topbar
        document.querySelector('.q-body').scrollTop=0;
        return;
      }
      showDone();return;
    }
  }
  currentIdx=Math.max(0,Math.min(vis.length-1,currentIdx+dir));
  render();
}

function buildClassification(){
  const r={};
  // BUG-11: include confirmed location in classification
  if(locationConfirmed){
    r.project = r.project || {};
    r.project.location = {
      confirmed: true,
      name: locationData.name,
      coordinates: { lat: locationData.lat, lng: locationData.lng }
    };
  }
  for(const q of SCHEMA.questions){
    const v=answers[q.id];
    if(v===undefined||v===''||(Array.isArray(v)&&v.length===0))continue;
    const parts=(q.writes_to||'').split('.');if(!parts[0])continue;
    let node=r;
    for(let i=0;i<parts.length-1;i++)node=node[parts[i]]=node[parts[i]]||{};
    node[parts[parts.length-1]]=v;
  }
  return r;
}

function showDone(){
  const cls=buildClassification();
  document.querySelector('.left').innerHTML=`
    <div class="done">
      <div style="font-size:52px">✅</div>
      <div style="font-size:18px;font-weight:600;color:#111">Intake complete</div>
      <div style="font-size:13px;color:#6b7280;max-width:320px;line-height:1.7">
        Your project has been submitted. The regAssist engine is mapping applicable
        regulations based on your jurisdiction and project classification.
      </div>
      <div class="cls-box">${JSON.stringify(cls,null,2)}</div>
      <button class="btn btn-next" onclick="location.reload()" style="margin-top:4px">← Start over</button>
    </div>`;
  document.querySelector('.prev-panel').innerHTML=`
    <div class="prev-title">Classification object — ${Object.keys(cls).length} top-level keys</div>
    <pre style="font-size:10px;font-family:monospace;color:#374151;line-height:1.5;overflow-y:auto;max-height:170px">${JSON.stringify(cls,null,2)}</pre>`;
}

// Start
render();
</script>
</body>
</html>
