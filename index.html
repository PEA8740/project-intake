.main{display:flex;flex:1;overflow:hidden}
.left-panel{width:390px;min-width:330px;border-right:1px solid #e5e7eb;display:flex;flex-direction:column;overflow:hidden;background:#fff}

    </div>
    <span class="loc-pill" id="coordPill">📍 43.6535, -79.3839</span>
    <span class="geocoding-spinner" id="spinner">Searching…</span>
  </div>

  <div class="main">
    <div class="left-panel">

<script>
// ── MAP SETUP ─────────────────────────────────────────────────────────────────
const DEFAULT_LAT=43.6535, DEFAULT_LNG=-79.3839;
const map = L.map('map').setView([DEFAULT_LAT,DEFAULT_LNG],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap contributors',maxZoom:19
}).addTo(map);

const markerIcon = L.icon({
  iconUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  iconRetinaUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
  shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize:[25,41],iconAnchor:[12,41],popupAnchor:[1,-34]
});

let marker = L.marker([DEFAULT_LAT,DEFAULT_LNG],{icon:markerIcon,draggable:true})
  .addTo(map)
  .bindPopup('Toronto, Ontario, Canada')
  .openPopup();

marker.on('dragend',function(){
  const ll=marker.getLatLng();
  document.getElementById('coordPill').textContent=`📍 ${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
  reverseGeocode(ll.lat,ll.lng);
});

map.on('click',function(e){
  marker.setLatLng(e.latlng);
  document.getElementById('coordPill').textContent=`📍 ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
  reverseGeocode(e.latlng.lat,e.latlng.lng);
});

async function geocode(){
  const q=document.getElementById('locInput').value.trim();
  if(!q)return;
  const sp=document.getElementById('spinner');
  sp.style.display='inline';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`,{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    if(d&&d.length>0){
      const lat=parseFloat(d[0].lat),lng=parseFloat(d[0].lon);
      map.setView([lat,lng],12);
      marker.setLatLng([lat,lng]).bindPopup(d[0].display_name).openPopup();
      document.getElementById('coordPill').textContent=`📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    }else{
      alert('Location not found. Try a different search term.');
    }
  }catch(e){alert('Search error. Check your internet connection.');}
  finally{sp.style.display='none';}
}

async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,{headers:{'Accept-Language':'en'}});
    const d=await r.json();
    if(d&&d.display_name){
      const short=d.address?(d.address.city||d.address.town||d.address.village||'')+(d.address.state?', '+d.address.state:'')+(d.address.country?', '+d.address.country:''):d.display_name;
      document.getElementById('locInput').value=short;
    }
  }catch(e){}
}

  {id:"water_streams",type:"multi_select",required:true,step:"Step 5 — Streams & Activities",writes_to:"classification.water_streams",label:"What water streams are involved in this project?",help:"Select all streams that will be collected, treated, discharged, reused, stored, or monitored.",options:[

    {id:"water_abstraction_withdrawal",label:"Water abstraction / withdrawal (intake pumping, well extraction)"},

// ── ENGINE ────────────────────────────────────────────────────────────────────
let answers={}, currentIdx=0;

function isVisible(q){
  const c=q.required_if; if(!c)return true;
  if(c.any_selected){const s=answers[c.any_selected.question]||[];return c.any_selected.values.some(v=>(Array.isArray(s)?s:[s]).includes(v));}
  if(c.equals)return answers[c.equals.question]===c.equals.value;
  if(c.all_selected){const s=answers[c.all_selected.question]||[];return c.all_selected.values.every(v=>s.includes(v));}
  if(c.none_selected){const s=answers[c.none_selected.question]||[];return!c.none_selected.values.some(v=>s.includes(v));}
  return true;
}

function visibleQ(){return SCHEMA.questions.filter(isVisible);}

// ── VALIDATION ────────────────────────────────────────────────────────────────
function validate(q){
  // Optional questions always pass
  if(q.required===false)return null;
  // Questions with required_if: required only when visible (already filtered)
  const v=answers[q.id];
  if(q.type==='text_area')return null; // text_area is always optional
  if(q.type==='multi_select'){
    if(!v||v.length===0)return'Please select at least one option to continue.';
  }else if(q.type==='radio'){
    if(!v)return'Please select one option to continue.';
  }
  return null;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function getDisplay(q){
  const v=answers[q.id];
  if(!v||(Array.isArray(v)&&v.length===0))return null;
  if(q.type==='text_area')return v.length>90?v.substring(0,90)+'…':v;
  if(Array.isArray(v))return v.map(id=>q.options?.find(o=>o.id===id)?.label||id).join(', ');
  return q.options?.find(o=>o.id===v)?.label||v;
}

function render(){
  const vis=visibleQ(), total=vis.length;
  if(currentIdx>=total){showDone();return;}
  const q=vis[currentIdx];

  document.getElementById('progressLabel').textContent=`Question ${currentIdx+1} of ${total}`;
  document.getElementById('stepBadge').textContent=q.step||'';
  document.getElementById('progressFill').style.width=Math.round((currentIdx/total)*100)+'%';

  const isReq=q.required!==false&&q.type!=='text_area';
  let html=`<div class="q-label">${q.label}${isReq?'<span class="q-required"> *</span>':''}</div>`;
  if(q.help)html+=`<p class="q-help">${q.help}</p>`;

  if(q.type==='text_area'){
    html+=`<textarea id="taInput" placeholder="${q.placeholder||''}" oninput="answers['${q.id}']=this.value">${answers[q.id]||''}</textarea>`;
  }else{
    const val=answers[q.id]||(q.type==='multi_select'?[]:null);
    html+='<div class="options">';
    for(const opt of q.options){
      const isMulti=q.type==='multi_select';
      const chk=isMulti?(val||[]).includes(opt.id):val===opt.id;
      html+=`<label class="opt${chk?' active':''}" onclick="handleChange('${q.id}','${opt.id}',${isMulti},event)">
        <input type="${isMulti?'checkbox':'radio'}" name="${q.id}" value="${opt.id}"${chk?' checked':''}><span class="opt-label">${opt.label}</span>
      </label>`;
    }
    html+='</div>';
  }
  html+=`<div class="error-msg" id="errMsg"></div>`;

  document.getElementById('qBody').innerHTML=html;
  document.getElementById('btnPrev').disabled=currentIdx===0;
  document.getElementById('btnNext').textContent=currentIdx===total-1?'Submit ✓':'Next →';
  renderPrev();
}

function handleChange(qId,optId,isMulti,e){
  e.preventDefault();
  if(isMulti){let a=answers[qId]||[];answers[qId]=a.includes(optId)?a.filter(v=>v!==optId):[...a,optId];}
  else answers[qId]=optId;
  // Clear error on change
  const err=document.getElementById('errMsg');
  if(err){err.classList.remove('visible');err.textContent='';}
  render();
}

function renderPrev(){
  const vis=visibleQ(), past=vis.slice(0,currentIdx).filter(q=>getDisplay(q));
  const el=document.getElementById('prevAnswers');
  if(!el)return;
  if(past.length===0){el.innerHTML='<p class="empty-prev">No previous answers yet.</p>';return;}
  el.innerHTML=past.map(q=>`<div class="prev-item"><div class="prev-q">${q.label}</div><div class="prev-a">${getDisplay(q)}</div></div>`).join('');
  el.scrollTop=el.scrollHeight;
}

function navigate(dir){
  const vis=visibleQ();
  if(dir===1){
    // Validate current question before moving forward
    const q=vis[currentIdx];
    const err=validate(q);
    if(err){
      const el=document.getElementById('errMsg');
      if(el){el.textContent='⚠ '+err;el.classList.add('visible');}
      return; // Block navigation
    }
    if(currentIdx>=vis.length-1){showDone();return;}
  }
  currentIdx=Math.max(0,Math.min(vis.length-1,currentIdx+dir));
  render();
}

function buildClassification(){
  const r={};
  for(const q of SCHEMA.questions){
    const v=answers[q.id];
    if(v===undefined||v===''||(Array.isArray(v)&&v.length===0))continue;
    const parts=(q.writes_to||'').split('.');if(!parts[0])continue;
    let node=r;
    for(let i=0;i<parts.length-1;i++)node=node[parts[i]]=node[parts[i]]||{};
    node[parts[parts.length-1]]=v;
  }
  return r;
}

function showDone(){
  const cls=buildClassification();
  document.querySelector('.left-panel').innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;flex:1">
      <div style="font-size:48px">✅</div>
      <div style="font-size:18px;font-weight:600;color:#111">Intake complete</div>
      <div style="font-size:13px;color:#6b7280;line-height:1.7">Your project has been submitted.<br>The regAssist engine is mapping applicable regulations.</div>
      <button class="btn btn-next" onclick="location.reload()" style="margin-top:8px">← Start over</button>
    </div>`;
  document.querySelector('.prev-panel').innerHTML=`
    <div class="prev-title">Classification object</div>
    <pre style="font-size:11px;font-family:monospace;color:#374151;line-height:1.6;overflow-y:auto;max-height:160px">${JSON.stringify(cls,null,2)}</pre>`;
}

render();
</script>
